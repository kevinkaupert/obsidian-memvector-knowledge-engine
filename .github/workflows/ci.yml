name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Check, Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build bundle
        run: npm run build

      # main.js is the shipped artifact and is committed, so a PR that changes src/
      # without rebuilding would put a bundle on main that does not match its source.
      # Only `npm run build` ran here before, which could never catch that.
      - name: Verify committed bundle matches source
        run: |
          if ! git diff --exit-code --stat -- main.js; then
            echo "::error file=main.js::main.js is out of date - run 'npm run build' and commit the result."
            exit 1
          fi
